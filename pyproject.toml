[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ghost-car"
version = "0.1.0"
description = "CLI and codecs for iRacing BLAP/OLAP generation and conversion"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["numpy"]

[project.scripts]
ghost-car = "ghost_car.cli:main"

[tool.setuptools.packages.find]
include = ["ghost_car*"]
