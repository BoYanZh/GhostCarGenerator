[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghost-car"
version = "0.1.0"
description = "CLI and codecs for iRacing laps and Assetto Corsa replays"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [
  { name = "BoYanZh" },
]
dependencies = ["numpy>=1.24"]

[project.scripts]
ghost-car = "ghost_car.cli:main"

[project.urls]
Repository = "https://github.com/BoYanZh/GhostCarGenerator"

[tool.setuptools]
include-package-data = true
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["ghost_car*"]

[tool.setuptools.package-data]
"ghost_car" = ["resources/tracks/**/*.json"]
"ghost_car._vendor" = ["LDParser.LICENSE", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
